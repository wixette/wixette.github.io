    <!-- Before the first paint: when the page will start in Chinese (?lang=, then the saved
         choice, then the browser's languages, as detect() in js/i18n.js decides), the English
         texts stay hidden until main.js writes the Chinese ones (site.css, .i18n-pending). -->
    <script>
      (() => {
        const zh = (t) => /^zh([-_]|$)/i.test(t ?? '');
        const ours = (t) => zh(t) || /^en(-|$)/i.test(t ?? '');
        let saved = null;
        try {
          saved = localStorage.getItem('wixette.lang');
        } catch {}
        const tags = [new URLSearchParams(location.search).get('lang'), saved, ...(navigator.languages ?? [navigator.language])];
        if (zh(tags.find(ours))) document.documentElement.classList.add('i18n-pending');
      })();
    </script>
