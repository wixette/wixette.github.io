name: Tests

# Types, tests and stamps on every push and pull request. Deployment is deploy.yml, which
# runs the same checks before it publishes.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the version comes from package.json's packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      # Development only: TypeScript's checker and the fonts and icons for pnpm vendor.
      # The page uses the copies in site/, and nothing is built.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Includes the stamp check: every content-hash URL in site/ must be current.
      - run: pnpm test
