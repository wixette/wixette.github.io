name: Deploy

# Publishes site/, unchanged, to GitHub Pages on every push to main (design D1), once the
# same checks as the Tests workflow pass. Needs Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the version comes from package.json's packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      # Only for the checks: the page itself is site/ as committed, and nothing is built.
      - run: pnpm install --frozen-lockfile
      # Types and tests, including the stamp check: every content-hash URL must be current.
      - run: pnpm check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
